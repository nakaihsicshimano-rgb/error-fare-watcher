name: Secret Flying Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions の cron は UTC基準
    #
    # 日本時間 08:37 = UTC 23:37（前日）
    # 日本時間 10:37 = UTC 01:37
    # 日本時間 12:37 = UTC 03:37
    # 日本時間 14:37 = UTC 05:37
    # 日本時間 16:37 = UTC 07:37
    # 日本時間 18:37 = UTC 09:37
    # 日本時間 20:37 = UTC 11:37
    # 日本時間 22:37 = UTC 13:37
    #
    # 毎時00分付近はGitHub Actions側の負荷が高く、遅延しやすい可能性があるため、
    # 37分にずらして実行する。
    - cron: "37 23 * * *"
    - cron: "37 1 * * *"
    - cron: "37 3 * * *"
    - cron: "37 5 * * *"
    - cron: "37 7 * * *"
    - cron: "37 9 * * *"
    - cron: "37 11 * * *"
    - cron: "37 13 * * *"

permissions:
  contents: write

concurrency:
  group: secret-flying-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        run: |
          python main.py

      - name: Commit seen_urls.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add seen_urls.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update seen URLs"

            # push前にリモートの最新状態を取り込む
            # 手動実行や定期実行が近いタイミングで重なった場合の競合を減らす
            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
